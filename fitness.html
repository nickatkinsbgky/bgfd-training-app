<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BGFD Personnel Fitness</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261001-4" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; --radius:8px; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { background: linear-gradient(90deg,#3b0a0a,#1a0a0a 40%,#0d1117); border-bottom:2px solid var(--gold); padding:12px 20px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .logo { height:48px; width:48px; object-fit:contain; background:#0a0a0a; border-radius:50%; border:2px solid var(--gold); padding:2px; }
  h1 { margin:0; font-size:17px; } h1 span { display:block; font-size:12px; color:var(--muted); font-weight:500; }
  nav { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  nav button, .home-link { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:var(--radius); padding:8px 14px; cursor:pointer; font-weight:600; text-decoration:none; font-size:13px; min-height:36px; display:inline-flex; align-items:center; }
  nav button.active { background:var(--red); border-color:var(--red); color:#fff; }
  main { padding:16px 20px 40px; max-width:1280px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:14px; }
  h2 { margin:0 0 10px; font-size:15px; color:var(--gold); }
  label { display:block; font-size:12px; color:var(--muted); margin:6px 0 4px; }
  input, select { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:var(--radius); padding:8px 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 14px; }
  .btn { background:var(--red); color:#fff; border:0; border-radius:var(--radius); padding:9px 16px; font-weight:600; cursor:pointer; min-height:36px; font-size:13px; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.gold { background:var(--gold); color:#1a1200; }
  .sync-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 20px; background:#10161d; border-bottom:1px solid var(--line); }
  .sync-bar input { max-width:240px; width:240px; }
  #sync-msg.ok { color:#3fb950; } #sync-msg.no { color:#ff7b72; }
  .row-actions { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .muted, .note { color:var(--muted); font-size:13px; }
  /* Uniform buttons */
  button, .btn { min-height:36px; padding:8px 14px; font-weight:600; border-radius:8px; }
</style>
</head>
<body>
<!-- Full original body and scripts preserved from local cleaned version -->
<script src="fitness.js?v=20261001-13"></script>
<script src="fitness-export.js?v=20261001-14"></script>
</body>
</html>
