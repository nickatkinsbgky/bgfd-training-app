<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>NERIS Reports — Bowling Green Fire Department</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261008-1" />
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:16px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { background: radial-gradient(circle at top, #3b0a0a 0%, #0d1117 42%); }
  header { display:flex; gap:14px; align-items:center; padding:16px 20px; background:linear-gradient(90deg,#3b0a0a,#161b22 55%); border-bottom:3px solid var(--gold); }
  header img { width:54px; height:54px; object-fit:contain; }
  h1 { margin:0; font-size:26px; }
  header p { margin:2px 0 0; color:var(--gold); font-weight:700; }
  a.exit { margin-left:auto; color:var(--gold); text-decoration:none; border:1px solid var(--gold); border-radius:10px; padding:8px 12px; font-weight:800; background:#241c0c; }
  main { width:min(1100px, 100%); margin:0 auto; padding:18px 16px 48px; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:0 0 16px; }
  .toolbar input { flex:1; min-width:220px; font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .toolbar select { font:inherit; color:var(--text); background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:10px 12px; }
  .note { color:var(--muted); font-size:14px; margin:0 0 16px; }
  .stats { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 16px; }
  .stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 14px; min-width:140px; }
  .stat b { display:block; font-size:20px; color:var(--gold); }
  .stat span { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
  .cards { display:grid; gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; }
  .card h3 { margin:0 0 6px; font-size:18px; color:#fff; }
  .meta { display:flex; gap:12px; flex-wrap:wrap; margin:0 0 8px; font-size:13px; color:var(--muted); }
  .meta span { background:#1c2330; border-radius:6px; padding:2px 8px; }
  .group { color:var(--gold); font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
  .def { margin:0; color:var(--text); }
  .no-results { text-align:center; color:var(--muted); padding:40px 20px; }
  @media (max-width:680px){ h1 { font-size:20px; } header { flex-wrap:wrap; } a.exit { margin-left:0; } }

  button, .btn, a, nav button { border-radius: 8px !important; padding: 8px 14px !important; font-weight: 600 !important; min-height: 36px; font-size: 13px; }
  button.red, .btn { background: #c62828 !important; color: #fff !important; }
  button.gold, a.exit { background: #241c0c !important; color: #d4a017 !important; border-color: #d4a017 !important; }
  button:hover { filter: brightness(1.08); }

  a.home-link { background:transparent; color:var(--text, #e6edf3); border:1px solid var(--gold, #d4a017); border-radius:8px; padding:8px 14px; font-weight:600; text-decoration:none; min-height:36px; display:inline-flex; align-items:center; margin-right:8px; }
  a.home-link:hover { filter:brightness(1.1); }
</style>
</head>
<body>
<header>
  <a class="home-link" href="index.html">Home</a>

  <img src="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261008-1" alt="BGFD" />
  <div>
    <h1>NERIS Reports</h1>
    <p id="subtitle">Incident Casualty-Rescue</p>
  </div>
</header>
<main>
  <p class="note">Searchable data dictionary for NERIS casualty and rescue modules. Civilian and firefighter data are kept separate. Source: NERIS Data Dictionary / USFA NERIS Release 1.0.1.</p>
  <div class="toolbar">
    <select id="module">
      <option value="civilian">Civilian (Non-Firefighter)</option>
      <option value="firefighter">Firefighter</option>
    </select>
    <input id="q" type="search" placeholder="Search field name, definition, or group…" />
    <select id="group">
      <option value="">All groups</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>
  <div class="cards" id="cards"></div>
</main>
<script>
(function () {
  var civilian = [
    { key: "nonff_rescue_birth_month_year", type: "Text", group: "general", definition: "The MM/YYYY of birth of the person(s) injured or rescued.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_gender", type: "Text", group: "general", definition: "The gender of the person(s) injured or rescued.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_race", type: "Text", group: "general", definition: "The race of the person(s) injured or rescued.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_type", type: "Text", group: "rescue", definition: "Whether there was a rescue, non-rescue, assist, or self evacuation.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_presence_known", type: "Text", group: "rescue", definition: "Whether the presence of an occupant in need of rescue was known.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_primary_mode", type: "Text", group: "rescue", definition: "The primary mode for rescue.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_actions", type: "Array[Text]", group: "rescue", definition: "Actions taken to support the rescue.", mandatory: false, cardinality: "Multi" },
    { key: "nonff_rescue_impediment_type", type: "Array[Text]", group: "rescue", definition: "Whether conditions impacted the ability of rescue.", mandatory: false, cardinality: "Multi" },
    { key: "nonff_rescue_room_type", type: "Text", group: "rescue.structure", definition: "The type of room/space from which the occupant was rescued.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_elevation_type", type: "Text", group: "rescue.structure", definition: "The elevation at which the occupant was found.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_gas_isolation", type: "Boolean", group: "rescue.structure", definition: "Whether the space was isolated from the flow of heat and/or toxic gases.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_removal_path_type", type: "Text", group: "rescue.structure", definition: "Route along which removal from the structure occurred.", mandatory: false, cardinality: "Single" },
    { key: "nonff_rescue_fire_relative_time", type: "Text", group: "rescue.structure", definition: "Relative to suppression, when the occupant was removed from the structure.", mandatory: false, cardinality: "Single" },
    { key: "nonff_casualty_casualty_type", type: "Text", group: "casualty", definition: "Whether the person was uninjured, injured nonfatally, injured fatally.", mandatory: false, cardinality: "Single" },
    { key: "nonff_casualty_casualty_cause", type: "Text", group: "casualty.injured", definition: "The apparent cause of the injury or fatality.", mandatory: false, cardinality: "Single" }
  ];

  var firefighter = [
    { key: "ff_rescue_birth_month_year", type: "Text", group: "general", definition: "Date of birth of the person(s) injured or rescued. MM/YYYY format required.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_gender", type: "Text", group: "general", definition: "Gender of the person(s) injured or rescued.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_race", type: "Text", group: "general", definition: "Race of the person(s) injured or rescued.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_rank", type: "Text", group: "casualty.demographic", definition: "Rank of firefighter.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_service", type: "Float", group: "casualty.demographic", definition: "Years of service.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_classification", type: "Text", group: "casualty.demographic", definition: "Job classification of firefighter.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_type", type: "Text", group: "rescue", definition: "Whether there was a rescue, non-rescue, assist, or self evacuation.", mandatory: true, cardinality: "Single" },
    { key: "ff_rescue_primary_mode", type: "Text", group: "rescue", definition: "Primary mode for rescue.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_actions", type: "Array[Text]", group: "rescue", definition: "Actions taken to support the rescue.", mandatory: false, cardinality: "Multi" },
    { key: "ff_rescue_impediment_type", type: "Array[Text]", group: "rescue", definition: "Whether conditions impacted the ability of rescue.", mandatory: false, cardinality: "Multi" },
    { key: "ff_rescue_mayday", type: "Boolean", group: "rescue.ff", definition: "Whether there was a mayday called to indicate a firefighter needed assistance during the incident.", mandatory: true, cardinality: "Single" },
    { key: "ff_rescue_mayday_relative_time", type: "Text", group: "rescue.ff", definition: "Relative to suppression, when the mayday was called.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_rit_activated", type: "Boolean", group: "rescue.ff", definition: "Whether a RIT team was activated following a mayday declaration.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_room_type", type: "Text", group: "rescue.structure", definition: "Type of room/space from which the occupant was rescued.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_elevation_type", type: "Text", group: "rescue.structure", definition: "Elevation at which the occupant was found.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_gas_isolation", type: "Boolean", group: "rescue.structure", definition: "Whether the space was isolated from the flow of heat and/or toxic gases.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_removal_path_type", type: "Text", group: "rescue.structure", definition: "How the firefighter was removed from the structure.", mandatory: false, cardinality: "Single" },
    { key: "ff_rescue_fire_relative_time", type: "Text", group: "rescue.structure", definition: "Relative to suppression, when the firefighter was removed from the structure.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_type", type: "Text", group: "casualty", definition: "Whether the person was uninjured, injured nonfatally, injured fatally.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_linked_unit_id", type: "Text", group: "casualty.injured.deployment", definition: "Name of the unit responding to the incident in FD Spec. Unit maps to Core Department Spec.", mandatory: true, cardinality: "Single" },
    { key: "ff_casualty_reported_unit_id", type: "Text", group: "casualty.injured.deployment", definition: "Name of the unit responding to the incident if neris id not yet in FD Spec.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_duty_type", type: "Text", group: "casualty.injured.deployment", definition: "Duty state of the firefighter at the time of the incident.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_cause", type: "Text", group: "casualty.injured.deployment", definition: "Apparent cause of the injury or fatality.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_action", type: "Text", group: "casualty.injured.deployment", definition: "Action that occurred during the time of the incident.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_ppe", type: "Array[Text]", group: "casualty.injured.deployment", definition: "PPE worn during time of incident.", mandatory: false, cardinality: "Multi" },
    { key: "ff_casualty_incident_command", type: "Boolean", group: "casualty.injured.deployment", definition: "Whether an incident command structure was in place during incident.", mandatory: false, cardinality: "Single" },
    { key: "ff_casualty_incident_timeline", type: "Text", group: "casualty.injured.deployment", definition: "Stage of the incident when the injury occurred.", mandatory: false, cardinality: "Single" }
  ];

  var datasets = { civilian: civilian, firefighter: firefighter };
  var moduleSel = document.getElementById("module");
  var groupSel = document.getElementById("group");
  var subtitle = document.getElementById("subtitle");

  function currentFields() {
    return datasets[moduleSel.value] || civilian;
  }

  function updateGroups() {
    var fields = currentFields();
    var groups = [];
    fields.forEach(function (f) {
      if (groups.indexOf(f.group) < 0) groups.push(f.group);
    });
    var current = groupSel.value;
    groupSel.innerHTML = '<option value="">All groups</option>';
    groups.forEach(function (g) {
      var o = document.createElement("option");
      o.value = g;
      o.textContent = g;
      groupSel.appendChild(o);
    });
    if ([].some.call(groupSel.options, function (o) { return o.value === current; })) {
      groupSel.value = current;
    }
  }

  function render() {
    var fields = currentFields();
    var query = document.getElementById("q").value.trim().toLowerCase();
    var gFilter = groupSel.value;
    var list = fields.filter(function (f) {
      if (gFilter && f.group !== gFilter) return false;
      if (!query) return true;
      var blob = (f.key + " " + f.definition + " " + f.group + " " + f.type).toLowerCase();
      return blob.indexOf(query) >= 0;
    });

    var groups = [];
    fields.forEach(function (f) {
      if (groups.indexOf(f.group) < 0) groups.push(f.group);
    });

    document.getElementById("stats").innerHTML =
      '<div class="stat"><b>' + list.length + '</b><span>Matching fields</span></div>' +
      '<div class="stat"><b>' + fields.length + '</b><span>Total fields</span></div>' +
      '<div class="stat"><b>' + groups.length + '</b><span>Groups</span></div>';

    subtitle.textContent = moduleSel.value === "firefighter"
      ? "Incident Casualty-Rescue Firefighter"
      : "Incident Casualty-Rescue Civilian (Non-Firefighter)";

    if (!list.length) {
      document.getElementById("cards").innerHTML = '<div class="no-results">No fields match your search.</div>';
      return;
    }

    document.getElementById("cards").innerHTML = list.map(function (f) {
      return '<article class="card">' +
        '<div class="group">' + f.group + '</div>' +
        '<h3>' + f.key + '</h3>' +
        '<div class="meta">' +
          '<span>' + f.type + '</span>' +
          '<span>' + (f.mandatory ? "Mandatory" : "Optional") + '</span>' +
          '<span>' + f.cardinality + '</span>' +
        '</div>' +
        '<p class="def">' + f.definition + '</p>' +
      '</article>';
    }).join("");
  }

  moduleSel.addEventListener("change", function () {
    updateGroups();
    render();
  });
  document.getElementById("q").addEventListener("input", render);
  groupSel.addEventListener("change", render);

  updateGroups();
  render();
})();
</script>
</body>
</html>
