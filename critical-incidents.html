<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Critical Incidents — Bowling Green Fire Department</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261007-1" />
<style>
  :root { --bg:#0d1117; --panel:#161b22; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:16px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; background: radial-gradient(circle at top, #3b0a0a 0%, #0d1117 42%); }
  .wrap { width:min(640px, 100%); text-align:center; }
  h1 { margin:0 0 8px; font-size:32px; }
  .sub { color:var(--gold); font-weight:700; margin:0 0 18px; letter-spacing:.06em; text-transform:uppercase; }
  .card { padding:28px 22px; border:1px solid var(--gold); border-radius:16px; background:linear-gradient(180deg, rgba(212,160,23,.16), rgba(22,27,34,.9)); box-shadow:0 12px 0 #5a4308, 0 18px 24px rgba(0,0,0,.4); }
  p { margin:0 0 18px; color:var(--muted); }
  a.back { display:inline-block; text-decoration:none; color:#fff; font-weight:800; border-radius:12px; padding:12px 18px; background:linear-gradient(160deg, #ef5350 0%, var(--red) 45%, #7f1212 100%); box-shadow:0 8px 0 #6d1010; }
</style>
</head>
<body>
  <div class="wrap">
    <p class="sub">Bowling Green Fire Department</p>
    <div class="card">
      <h1>Critical Incidents</h1>
      <p>This app is not built yet. The home page button is reserved for the future Critical Incidents app.</p>
      <a class="back" href="index.html">Back to home</a>
    </div>
  </div>
</body>
</html>
