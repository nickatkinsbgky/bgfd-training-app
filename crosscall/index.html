<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>CrossCall</title>
  <script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
  <style>
    :root { --bg:#0c1220; --card:#161e2e; --line:#2a3650; --text:#f4f7fb; --muted:#9aa8be; --blue:#3d7eff; --danger:#ff5d6c; --ok:#3dd68c; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    button, input { font: inherit; color: inherit; }
    .screen { min-height: 100dvh; }
    .lobby { max-width: 460px; margin: 0 auto; padding: 28px 18px 40px; }
    .brand { display: flex; gap: 12px; align-items: center; margin-bottom: 18px; }
    .logo { width: 46px; height: 46px; border-radius: 14px; background: linear-gradient(160deg, #6aa2ff, #1d4ed8); display: grid; place-items: center; font-weight: 800; }
    h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .sub { color: var(--muted); margin: 4px 0 0; font-size: 14px; line-height: 1.4; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 14px; }
    label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 6px; }
    input { width: 100%; background: #0f1728; border: 1px solid var(--line); border-radius: 12px; padding: 13px; outline: none; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    .btn { border: 0; border-radius: 12px; padding: 13px 14px; background: var(--blue); font-weight: 700; cursor: pointer; }
    .btn.secondary { background: #0f1728; border: 1px solid var(--line); font-weight: 600; }
    .btn.full { width: 100%; }
    .btn:disabled { opacity: .55; }
    .fine { color: var(--muted); font-size: 12.5px; line-height: 1.45; }
    .call { display: flex; flex-direction: column; min-height: 100dvh; }
    .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 14px 8px; }
    .pill { background: #122033; border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; font-size: 12px; color: var(--muted); }
    .grid { flex: 1; display: grid; gap: 8px; padding: 8px 12px 12px; grid-template-columns: 1fr; }
    .grid.multi { grid-template-columns: 1fr 1fr; }
    .tile { position: relative; background: #10192b; border-radius: 16px; overflow: hidden; min-height: 180px; }
    video { width: 100%; height: 100%; object-fit: cover; background: #0b1220; display: block; min-height: 180px; }
    .tag { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.55); border-radius: 999px; padding: 4px 8px; font-size: 12px; }
    .controls { display: flex; justify-content: center; gap: 10px; padding: 8px 12px 22px; }
    .round { width: 54px; height: 54px; border-radius: 50%; border: 0; background: #1b2740; color: white; font-size: 13px; font-weight: 700; }
    .round.off { background: #3a2a2e; color: #ffb4bc; }
    .round.end { background: var(--danger); color: #2a0b10; }
    .status { color: var(--ok); font-size: 13px; }
    .err { color: #ffb4bc; font-size: 13px; margin-top: 8px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <section class="screen lobby" id="lobby">
    <div class="brand"><div class="logo">CC</div><div><h1>CrossCall</h1><p class="sub">Video calls on iPhone, iPad, Android, and desktop. Same room code, no Apple ID.</p></div></div>
    <div class="card">
      <label for="name">Your name</label><input id="name" maxlength="24" placeholder="Nick" autocomplete="name" />
      <label for="room">Room code</label><input id="room" maxlength="20" placeholder="station1" autocapitalize="off" autocorrect="off" />
      <div class="row"><button class="btn full" id="start">Start room</button><button class="btn secondary full" id="join">Join room</button></div>
      <p class="err" id="err"></p>
      <p class="fine">The first person taps Start and stays in the call. Everyone else taps Join with the same code. Open this page in Safari or Chrome.</p>
    </div>
  </section>
  <section class="screen call hidden" id="call">
    <div class="top"><div><strong id="roomLabel">Room</strong><div class="status" id="status">Connecting</div></div><button class="pill" id="copy">Copy invite</button></div>
    <div class="grid" id="grid"></div>
    <div class="controls"><button class="round" id="mic">Mic</button><button class="round" id="cam">Cam</button><button class="round" id="flip">Flip</button><button class="round end" id="hang">End</button></div>
  </section>
  <script>
    const $ = (id) => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    if (params.get("room")) $("room").value = params.get("room");
    if (params.get("name")) $("name").value = params.get("name");
    const ice = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun.cloudflare.com:3478" }] };
    const peerOpts = { host: "0.peerjs.com", port: 443, path: "/", secure: true, config: ice, debug: 0 };
    let peer, localStream, facing = "user", micOn = true, camOn = true;
    let me = { id: "", name: "", room: "", host: false };
    const others = new Map();
    function slug(value) { return (value || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 18); }
    function rand() { return Math.random().toString(36).slice(2, 8); }
    function hostId(room) { return "xc" + room; }
    function showErr(text) { $("err").textContent = text || ""; }
    function tile(id, label, stream, muted) {
      let el = document.getElementById("tile-" + id);
      if (!el) { el = document.createElement("div"); el.className = "tile"; el.id = "tile-" + id; el.innerHTML = '<video playsinline autoplay></video><div class="tag"></div>'; $("grid").appendChild(el); }
      const video = el.querySelector("video"); video.muted = !!muted; if (stream && video.srcObject !== stream) video.srcObject = stream;
      el.querySelector(".tag").textContent = label; $("grid").classList.toggle("multi", $("grid").children.length > 1); return el;
    }
    function drop(id) { const el = document.getElementById("tile-" + id); if (el) el.remove(); others.delete(id); $("grid").classList.toggle("multi", $("grid").children.length > 1); $("status").textContent = others.size ? others.size + " connected" : "Waiting for someone to join"; }
    async function camera() {
      if (localStream) localStream.getTracks().forEach((t) => t.stop());
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: facing } });
      localStream.getAudioTracks().forEach((t) => t.enabled = micOn);
      localStream.getVideoTracks().forEach((t) => t.enabled = camOn);
      tile("me", me.name + " (you)", localStream, true);
    }
    function attachCall(call, name) {
      if (others.has(call.peer) && others.get(call.peer).call) return;
      const rec = others.get(call.peer) || { name: name || "Guest", call: null }; rec.call = call; others.set(call.peer, rec);
      call.on("stream", (stream) => { tile(call.peer, rec.name, stream, false); $("status").textContent = others.size + " connected"; });
      call.on("close", () => drop(call.peer)); call.on("error", () => drop(call.peer));
    }
    function callPeer(id, name) { if (!peer || !localStream || id === me.id || (others.get(id) && others.get(id).call)) return; attachCall(peer.call(id, localStream, { metadata: { name: me.name } }), name); }
    function send(conn, data) { if (conn && conn.open) conn.send(data); }
    function boot(id, asHost) {
      peer = new Peer(id, peerOpts);
      peer.on("open", () => {
        me.id = peer.id; $("status").textContent = asHost ? "Room open. Share the code." : "Joining room";
        if (!asHost) {
          const conn = peer.connect(hostId(me.room), { metadata: { name: me.name } });
          conn.on("open", () => send(conn, { type: "join", name: me.name, id: me.id }));
          conn.on("data", (msg) => { if (msg.type === "peers") msg.peers.forEach((p) => callPeer(p.id, p.name)); });
          others.set(hostId(me.room), { name: "Host", conn });
        }
      });
      peer.on("call", (call) => { call.answer(localStream); attachCall(call, (call.metadata && call.metadata.name) || "Guest"); });
      peer.on("connection", (conn) => {
        conn.on("data", (msg) => {
          if (asHost && msg.type === "join") {
            const known = [...others.entries()].map(([pid, rec]) => ({ id: pid, name: rec.name })); known.push({ id: me.id, name: me.name });
            others.set(msg.id, { name: msg.name, conn }); send(conn, { type: "peers", peers: known });
            others.forEach((rec, pid) => { if (pid !== msg.id) send(rec.conn, { type: "new", peer: { id: msg.id, name: msg.name } }); });
          }
          if (!asHost && msg.type === "new") callPeer(msg.peer.id, msg.peer.name);
        });
      });
      peer.on("error", (err) => {
        const type = err && err.type;
        if (type === "unavailable-id" && asHost) { peer.destroy(); $("status").textContent = "Room already open. Joining it."; boot(hostId(me.room) + rand(), false); return; }
        $("status").textContent = type === "peer-unavailable" ? "Room is not open yet. Someone has to tap Start first." : "Connection problem. Check the room code and try again.";
      });
    }
    async function enter(asHost) {
      showErr(""); me.name = ($("name").value || "Guest").trim().slice(0, 24); me.room = slug($("room").value); me.host = asHost;
      if (!me.room) { showErr("Enter a room code, letters and numbers only."); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showErr("This browser cannot use the camera. Open in Safari or Chrome over HTTPS."); return; }
      $("start").disabled = true; $("join").disabled = true;
      try { await camera(); } catch (e) { $("start").disabled = false; $("join").disabled = false; showErr("Camera or mic permission was blocked."); return; }
      $("lobby").classList.add("hidden"); $("call").classList.remove("hidden"); $("roomLabel").textContent = me.room;
      boot(asHost ? hostId(me.room) : hostId(me.room) + rand(), asHost);
    }
    $("start").onclick = () => enter(true);
    $("join").onclick = () => enter(false);
    $("copy").onclick = async () => {
      const link = location.origin + location.pathname + "?room=" + encodeURIComponent(me.room);
      const text = "Join my CrossCall room " + me.room + "\n" + link;
      try { if (navigator.share) await navigator.share({ title: "CrossCall", text, url: link }); else await navigator.clipboard.writeText(text); $("status").textContent = "Invite copied"; }
      catch { $("status").textContent = "Room code: " + me.room; }
    };
    $("mic").onclick = () => { micOn = !micOn; localStream && localStream.getAudioTracks().forEach((t) => t.enabled = micOn); $("mic").classList.toggle("off", !micOn); $("mic").textContent = micOn ? "Mic" : "Muted"; };
    $("cam").onclick = () => { camOn = !camOn; localStream && localStream.getVideoTracks().forEach((t) => t.enabled = camOn); $("cam").classList.toggle("off", !camOn); $("cam").textContent = camOn ? "Cam" : "Off"; };
    $("flip").onclick = async () => { facing = facing === "user" ? "environment" : "user"; try { await camera(); } catch { $("status").textContent = "Could not flip camera"; } };
    $("hang").onclick = () => { if (localStream) localStream.getTracks().forEach((t) => t.stop()); if (peer) peer.destroy(); location.href = location.pathname + "?room=" + encodeURIComponent(me.room || ""); };
  </script>
</body>
</html>
