<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMS Recertification Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="landing" hidden></div>
<div id="app">
  <h1>EMS Recertification Tracker</h1>
  <div id="stats"></div>
  <p>
    <input id="q" type="search" placeholder="Search people">
    <select id="statusFilter">
      <option value="">All</option>
      <option value="Met">Met</option>
      <option value="Short">Short</option>
      <option value="Set exp date">Needs exp date</option>
    </select>
  </p>
  <div class="wrap">
    <table>
      <thead id="head"></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div id="sumStatus"></div>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="ems-recert-data.js"></script>
<script src="ems-recert.js"></script>
</body>
</html>
