<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BGFD Training Performance App</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20260926-2" />
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI", system-ui, sans-serif; }
  header { background: linear-gradient(90deg,#3b0a0a,#1a0a0a 40%,#0d1117); border-bottom:3px solid var(--gold); padding:14px 22px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .logo { height:56px; width:56px; object-fit:contain; background:#0a0a0a; border-radius:50%; border:2px solid var(--gold); padding:2px; }
  h1 { margin:0; font-size:18px; }
  h1 span { display:block; font-size:12px; color:var(--muted); font-weight:500; }
  nav { display:flex; gap:6px; margin-left:auto; flex-wrap:wrap; }
  nav button { background:transparent; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 12px; cursor:pointer; font-weight:600; }
  nav button.active { background:var(--red); border-color:var(--red); }
  main { padding:18px 22px 48px; max-width:1280px; margin:0 auto; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px 18px; margin-bottom:16px; }
  h2 { margin:0 0 12px; font-size:16px; color:var(--gold); }
  label { display:block; font-size:12px; color:var(--muted); margin:8px 0 4px; }
  input, select { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:8px 10px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px 14px; }
  .btn { background:var(--red); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-weight:700; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .btn.gold { background:var(--gold); color:#1a1200; }
  .row-actions { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { border-bottom:1px solid var(--line); padding:7px 8px; text-align:left; }
  th { color:var(--muted); font-size:11px; text-transform:uppercase; }
  .muted, .note { color:var(--muted); font-size:12px; }
  .ok { color:#3fb950; } .no { color:#ff7b72; }
  .split { display:grid; grid-template-columns:280px 1fr; gap:16px; }
  .plist button { width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-bottom:1px solid var(--line); padding:8px 6px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <img class="logo" src="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20260926-2" alt="BGFD" />
  <h1>Bowling Green Fire Department<span>Training Division • Personnel Performance App</span></h1>
  <nav>
    <button class="active" data-tab="input">Enter / edit</button>
    <button data-tab="person">By personnel</button>
    <button data-tab="roster">Roster / catalog</button>
  </nav>
</header>
<main>
  <section id="tab-input" class="card">
    <h2>Assignments</h2>
    <p class="muted" id="form-hint">Loading…</p>
    <div class="row-actions">
      <button class="btn gold" id="btn-restore-original" type="button">Restore original data</button>
      <button class="btn gold" id="btn-export">Export JSON</button>
    </div>
    <p class="note" id="save-msg"></p>
    <p class="note" id="sync-msg"></p>
    <div id="all-table"></div>
  </section>
  <section id="tab-person" class="card" hidden>
    <h2>By personnel</h2>
    <div class="split"><div class="plist" id="p-list"></div><div id="p-detail"></div></div>
  </section>
  <section id="tab-roster" class="card" hidden>
    <h2>Roster / catalog</h2>
    <div id="r-out"></div>
  </section>
</main>
<datalist id="dl-people"></datalist>
<select id="f-task" hidden></select>
<select id="f-cat" hidden></select>
<select id="n-cat" hidden></select>
<select id="c-cat" hidden></select>
<script src="seed-personnel-a.js?v=20260926-2"></script>
<script src="seed-personnel-b.js?v=20260926-2"></script>
<script src="seed-personnel.js?v=20260926-2"></script>
<script src="seed-tasks.js?v=20260926-2"></script>
<script src="seed-assignments.js?v=20260926-2"></script>
<script src="seed.js?v=20260926-2"></script>
<script src="app-part1.js?v=20260928-6"></script>
<script>
(function () {
  var btn = document.getElementById('btn-restore-original');
  if (btn) btn.onclick = function () {
    if (!confirm('Load original 178 people / 61 assignments?')) return;
    var next = JSON.parse(JSON.stringify(SEED));
    if (typeof migrate === 'function') next = migrate(next);
    localStorage.setItem('bgfd-training-app-v2', JSON.stringify(next));
    db = next; window.db = next;
    if (typeof fillPeople === 'function') fillPeople();
    if (typeof renderAllTable === 'function') renderAllTable();
    alert('Loaded ' + next.personnel.length + ' people and ' + next.assignments.length + ' assignments.');
  };
  var exp = document.getElementById('btn-export');
  if (exp) exp.onclick = function () {
    var blob = new Blob([JSON.stringify(window.db || db, null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'bgfd-training-data.json';
    a.click();
  };
  var hint = document.getElementById('form-hint');
  if (hint && window.db) hint.textContent = window.db.personnel.length + ' personnel • ' + window.db.assignments.length + ' assignments loaded.';
})();
</script>
</body>
</html>
