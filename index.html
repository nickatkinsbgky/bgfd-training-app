<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bowling Green Fire Department</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20260926-2" />
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:16px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; background: radial-gradient(circle at top, #3b0a0a 0%, #0d1117 42%); }
  .wrap { width:min(720px, 100%); text-align:center; }
  .logo-ring { width:220px; height:220px; margin:0 auto 18px; border-radius:50%; border:4px solid var(--gold); background:#0a0a0a; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(212,160,23,.12); }
  .logo-ring img { width:186px; height:186px; object-fit:contain; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:.02em; }
  .sub { color:var(--gold); font-weight:600; margin:0 0 28px; }
  .actions { display:flex; flex-direction:column; gap:14px; }
  a.choice, button.choice { display:block; width:100%; text-align:center; text-decoration:none; border-radius:10px; padding:18px 16px; font-size:18px; font-weight:700; cursor:pointer; border:1px solid var(--line); }
  a.choice { background:var(--red); color:#fff; border-color:var(--red); }
  a.choice small, button.choice small { display:block; font-weight:500; font-size:13px; opacity:.85; margin-top:4px; }
  button.choice { background:var(--panel); color:var(--text); }
  button.choice:hover, a.choice:hover { filter:brightness(1.08); }
  #soon { min-height:22px; color:var(--muted); margin:14px 0 0; }
  @media (max-width:600px){ h1 { font-size:22px; } .logo-ring { width:170px; height:170px; } .logo-ring img { width:142px; height:142px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-ring">
      <img src="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20260926-2" alt="Bowling Green Fire Department" />
    </div>
    <h1>Bowling Green Fire Department</h1>
    <p class="sub">Personnel systems</p>
    <div class="actions">
      <a class="choice" href="training.html">Personnel Performance<small>Training Division</small></a>
      <button class="choice" id="fitness" type="button">Personnel Fitness<small>Fitness Committee</small></button>
    </div>
    <p id="soon"></p>
  </div>
  <script>
    document.getElementById('fitness').onclick = function () {
      document.getElementById('soon').textContent = 'Fitness Committee is not linked yet.';
    };
  </script>
</body>
</html>
