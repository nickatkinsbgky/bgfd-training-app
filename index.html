<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<title>Bowling Green Fire Department</title>
<link rel="icon" href="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261001-2" />
<style>
  :root { --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#c62828; --gold:#d4a017; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font:16px/1.45 "Segoe UI", system-ui, sans-serif; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:28px 16px; background: radial-gradient(circle at top, #3b0a0a 0%, #0d1117 42%); }
  .wrap { width:min(720px, 100%); text-align:center; }
  .logo-ring { width:220px; height:220px; margin:0 auto 18px; border-radius:50%; border:4px solid var(--gold); background:#0a0a0a; display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 8px rgba(212,160,23,.12); }
  .logo-ring img { width:186px; height:186px; object-fit:contain; }
  h1 { margin:0 0 6px; font-size:28px; letter-spacing:.02em; }
  .sub { color:var(--gold); font-weight:600; margin:0 0 10px; }
  .banner { margin:0 0 28px; padding:10px 14px; border:1px solid var(--gold); border-radius:8px; color:var(--text); background:rgba(212,160,23,.08); font-weight:650; letter-spacing:.01em; }
  .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:18px; }
  a.choice { display:flex; flex-direction:column; align-items:center; justify-content:center; width:280px; height:280px; text-align:center; text-decoration:none; border-radius:16px; padding:24px 18px; font-size:22px; font-weight:700; cursor:pointer; border:1px solid var(--red); background:var(--red); color:#fff; }
  a.choice.alt { background:var(--panel); color:var(--text); border-color:var(--gold); }
  a.choice small { display:block; font-weight:500; font-size:15px; opacity:.9; margin-top:10px; }
  a.choice:hover { filter:brightness(1.08); }
  button.owner { width:min(578px, 100%); margin-top:8px; background:transparent; color:var(--gold); border:1px solid var(--gold); border-radius:10px; padding:12px 16px; font-size:16px; font-weight:700; cursor:pointer; }
  button.owner:hover { filter:brightness(1.08); }
  button.upload { width:min(578px, 100%); background:var(--panel); color:var(--text); border:1px solid var(--gold); border-radius:10px; padding:14px 16px; font-size:18px; font-weight:700; cursor:pointer; }
  button.upload:hover { filter:brightness(1.08); }
  .owner-note { color:var(--muted); font-size:13px; margin:8px 0 0; }
  @media (max-width:680px){ h1 { font-size:22px; } .logo-ring { width:170px; height:170px; } .logo-ring img { width:142px; height:142px; } a.choice { width:100%; height:180px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo-ring">
      <img src="https://www.joinbgky.org/wp-content/uploads/2022/01/logo-bg-fire.png?v=20261001-2" alt="Bowling Green Fire Department" />
    </div>
    <h1>Bowling Green Fire Department</h1>
    <p class="sub">Personnel systems</p>
    <p class="banner">Making it Better for the Citizens of Bowling Green</p>
    <div class="actions">
      <a class="choice" href="training.html">Personnel Performance<small>Training Division</small></a>
      <a class="choice alt" href="fitness.html">Personnel Fitness<small>Fitness Committee</small></a>
      <button class="upload" id="btn-upload-all" type="button">Upload to Site</button>
      <p class="owner-note" id="upload-note"></p>
      <button class="owner" id="owner-btn" type="button">Owner sign-in</button>
      <p class="owner-note" id="owner-note">Sign in here before editing Personnel Performance.</p>
    </div>
  </div>
<script>
(function () {
  var SESSION = 'bgfd-owner-unlock';
  var PASS = 'Bomberonick5606!';
  var btn = document.getElementById('owner-btn');
  var note = document.getElementById('owner-note');
  function paint() {
    var on = sessionStorage.getItem(SESSION) === '1';
    btn.textContent = on ? 'Owner signed in' : 'Owner sign-in';
    note.textContent = on ? 'Signed in for this visit. Open Personnel Performance to edit.' : 'Sign in here before editing Personnel Performance.';
  }
  btn.onclick = function () {
    if (sessionStorage.getItem(SESSION) === '1') {
      sessionStorage.removeItem(SESSION);
      paint();
      return;
    }
    var entered = window.prompt('Owner password');
    if (entered == null) return;
    if (entered === PASS) {
      sessionStorage.setItem(SESSION, '1');
      paint();
    } else {
      window.alert('Incorrect password. The site stays view-only.');
    }
  };
  paint();
})();
</script>

<script>
(function () {
  var TOKEN_KEY = 'bgfd-gh-token';
  var note = document.getElementById('upload-note');
  function setNote(text) { if (note) note.textContent = text || ''; }
  function b64(str) {
    var bytes = new TextEncoder().encode(str);
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  async function putFile(token, path, obj, label) {
    var api = 'https://api.github.com/repos/nickatkinsbgky/bgfd-training-app/contents/' + path;
    var headers = { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' };
    var content = b64(JSON.stringify(obj));
    var last = '';
    for (var attempt = 1; attempt <= 5; attempt++) {
      var meta = await fetch(api + '?ref=main&t=' + Date.now(), { headers: headers, cache: 'no-store' });
      var sha = null;
      if (meta.ok) sha = (await meta.json()).sha;
      var body = { message: 'Upload ' + label + ' from homepage ' + new Date().toISOString(), content: content, branch: 'main' };
      if (sha) body.sha = sha;
      var res = await fetch(api, { method: 'PUT', headers: headers, body: JSON.stringify(body) });
      var info = await res.json().catch(function () { return {}; });
      if (res.ok) return;
      last = info.message || ('HTTP ' + res.status);
      if (attempt < 5 && /sha|match|409/i.test(last)) continue;
      throw new Error(label + ': ' + last);
    }
    throw new Error(label + ': ' + (last || 'upload failed'));
  }
  document.getElementById('btn-upload-all').onclick = async function () {
    var token = (localStorage.getItem(TOKEN_KEY) || '').trim();
    if (!token) {
      token = window.prompt('Paste the GitHub token used by Personnel Performance') || '';
      token = token.trim();
      if (!token) { setNote('Upload cancelled. A GitHub token is required.'); return; }
      localStorage.setItem(TOKEN_KEY, token);
    }
    var jobs = [
      ['bgfd-training-app-v2', 'data.json', 'Personnel Performance'],
      ['bgfd-fitness-app-v1', 'fitness-data.json', 'Personnel Fitness']
    ];
    setNote('Uploading both apps…');
    var done = [];
    try {
      for (var i = 0; i < jobs.length; i++) {
        var raw = localStorage.getItem(jobs[i][0]);
        if (!raw) { done.push(jobs[i][2] + ' has no saved data on this device'); continue; }
        await putFile(token, jobs[i][1], JSON.parse(raw), jobs[i][2]);
        done.push(jobs[i][2] + ' uploaded');
      }
      setNote(done.join('. ') + '.');
    } catch (err) {
      setNote('Upload failed. ' + err.message);
    }
  };
})();
</script>

</body>
</html>
