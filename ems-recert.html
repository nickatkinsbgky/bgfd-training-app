<!DOCTYPE html>
<html>
<head>
<title>EMS Recertification Tracker</title>
<style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:20px}button{background:#241c0c;color:#d4a017;border:1px solid #d4a017;padding:12px 20px;font-size:16px;cursor:pointer;border-radius:8px}</style>
</head>
<body>
<h1>EMS Recertification Tracker</h1>
<p>Click the button below to load the latest site data (including records since August).</p>
<button id="btn-pull" type="button">Load site data</button>
<p id="sync-msg" style="margin-top:12px;color:#8b949e"></p>
<script>
document.getElementById('btn-pull').onclick = async function() {
  var msg = document.getElementById('sync-msg');
  msg.textContent = 'Loading site data...';
  try {
    var res = await fetch('https://raw.githubusercontent.com/nickatkinsbgky/bgfd-training-app/main/ems-recert-data.json?t=' + Date.now(), {cache:'no-store'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    localStorage.setItem('bgfd-ems-recert-excel-v1', JSON.stringify(data));
    msg.textContent = 'Loaded ' + (data.people ? data.people.length : 0) + ' people and ' + (data.records ? data.records.length : 0) + ' classes. Hard-refresh the full page or go back to the normal tracker.';
    msg.style.color = '#7dcea0';
  } catch(e) {
    msg.textContent = 'Failed: ' + e.message;
    msg.style.color = '#f5b7b1';
  }
};
</script>
</body>
</html>
