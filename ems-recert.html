<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMS Recertification Tracker</title>
<style>
body{font-family:system-ui,sans-serif;margin:16px;background:#f6f1e7;color:#1c1917}
table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:6px 8px;border-bottom:1px solid #ddd;text-align:left}
#stats{display:flex;gap:12px;margin-bottom:12px}
.stat{padding:8px 12px;background:#fff;border-radius:6px}
.hidden{display:none}
</style>
</head>
<body>
<div id="landing" class="hidden"></div>
<div id="app">
  <div id="stats"></div>
  <input id="q" type="search" placeholder="Search people">
  <select id="statusFilter">
    <option value="">All</option>
    <option value="Met">Met</option>
    <option value="Short">Short</option>
    <option value="Set exp date">Needs exp date</option>
  </select>
  <table>
    <thead id="head"></thead>
    <tbody id="body"></tbody>
  </table>
  <div id="sumStatus"></div>

  <!-- Edit person form (required by script) -->
  <div id="editPanel" class="hidden">
    <input id="editName">
    <input id="editId">
    <select id="editCert"><option>EMT</option><option>EMR</option><option>AEMT</option><option>Paramedic</option></select>
    <input id="editExp" type="date">
    <button id="savePerson" type="button">Save</button>
    <button id="cancelEdit" type="button">Cancel</button>
  </div>
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
<script src="ems-recert-data.js"></script>
<script src="ems-recert.js"></script>
</body>
</html>
